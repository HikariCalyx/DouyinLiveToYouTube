# /etc/nginx/sites-available/livemgr
#
# 安装（Debian/Ubuntu）：
#   sudo cp deploy/nginx/livemgr.conf /etc/nginx/sites-available/livemgr
#   sudo ln -sfn /etc/nginx/sites-available/livemgr /etc/nginx/sites-enabled/livemgr
#   sudo rm -f /etc/nginx/sites-enabled/default        # 关键：否则默认站点会抢走请求
#   sudo nginx -t && sudo systemctl reload nginx
#
# RHEL/CentOS/Fedora 没有 sites-available，放到 /etc/nginx/conf.d/livemgr.conf 即可。
#
# 只经由 CloudFront 访问时，把 listen 改为 127.0.0.1:80 或用安全组限制来源，
# 避免有人绕过 CloudFront 直连源站。

# CloudFront 会带 X-Forwarded-Proto；直接访问源站（健康检查）时回退到本地协议。
map $http_x_forwarded_proto $livemgr_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream livemgr_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    # default_server 让所有未匹配 server_name 的请求（包括 CloudFront 回源时带来的
    # 分配域名 Host）都落到这里。若同机还有别的站点，请删掉 default_server 并改用：
    #   server_name d111111abcdef8.cloudfront.net live.example.com;
    listen 80 default_server;
    # 服务器未启用 IPv6 时保持注释，否则 nginx 会因无法绑定而启动失败
    # listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/livemgr.access.log;
    error_log  /var/log/nginx/livemgr.error.log;

    client_max_body_size 1m;

    # 健康检查直连（不经过 CloudFront）
    location = /healthz {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $livemgr_forwarded_proto;
        proxy_pass http://livemgr_app;
        access_log off;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 保留 CloudFront 传来的 Host，Django 才能匹配 ALLOWED_HOSTS
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;

        # 必须透传：Django 用 SECURE_PROXY_SSL_HEADER 判断 HTTPS，并据此把
        # 会话/CSRF Cookie 标记为 Secure。缺失会导致登录后反复跳转或表单 403。
        proxy_set_header X-Forwarded-Proto $livemgr_forwarded_proto;

        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        proxy_pass http://livemgr_app;
    }
}
