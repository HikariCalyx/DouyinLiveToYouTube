{% load static %}<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}抖音 → YouTube{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'streams/app.css' %}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{% url 'dashboard' %}">抖音 → YouTube</a>
  {% if user.is_authenticated %}
  <nav>
    <a href="{% url 'dashboard' %}">直播间</a>
    <a href="{% url 'settings' %}">全局设置</a>
    <a href="{% url 'admin:index' %}">Admin</a>
    <form method="post" action="{% url 'logout' %}" class="inline-form">
      {% csrf_token %}
      <button type="submit" class="link-button">退出（{{ user.get_username }}）</button>
    </form>
  </nav>
  {% endif %}
</header>
<main class="page">
  {% if messages %}
  <ul class="messages">
    {% for message in messages %}<li class="msg-{{ message.tags }}">{{ message }}</li>{% endfor %}
  </ul>
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
