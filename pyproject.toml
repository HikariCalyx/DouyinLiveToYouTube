[project]
name = "DouyinLiveToYouTube"
version = "2.0.0"
description = "Django 仪表盘：将抖音直播实时转发至 YouTube（FFmpeg RTMP 推流）"
readme = "README.md"
authors = [{name = "HikariCalyx"}]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<6.0",
    "whitenoise>=6.6",
    "gunicorn>=23.0",
    "httpx[http2]>=0.28.1",
]

[tool.setuptools]
packages = ["dashboard", "streams", "src"]
