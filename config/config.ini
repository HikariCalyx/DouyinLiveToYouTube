[推流设置]
# 检测直播状态的循环间隔(秒)
循环时间(秒) = 60
# 直播画质: 原画 / 蓝光 / 超清 / 高清 / 标清 / 流畅
直播画质 = 原画
# 视频编码: auto(H.264直接复制, H.265自动转码) / copy(始终不转码) / libx264(始终转码)
视频编码 = auto
# 转码时的视频码率上限(kbps)，仅在需要转码时生效
视频码率(kbps) = 6000
# 音频码率，YouTube 推荐 128k 以上
音频码率 = 160k
# 推流中断后重新检测直播状态的等待时间(秒)
断流重试间隔(秒) = 10
# 是否在日志中显示直播源地址(是/否)
是否显示直播源地址(是/否) = 否

[YouTube]
# YouTube 直播推流服务器地址
RTMP服务器地址 = rtmp://a.rtmp.youtube.com/live2
# 默认串流密钥，可在 URL_config.ini 中为单个直播间单独指定
默认串流密钥 =

[抖音]
# 建议填写网页端登录后的 Cookie，可降低触发风控的概率
抖音cookie =
